name: "AI-Ready Bug Report"
description: "Report a bug with enough context for AI-assisted fixing"
title: "[Bug]: "
labels: ["bug", "ai-ready"]
body:
  - type: markdown
    attributes:
      value: |
        ## AI-Ready Bug Report
        Please fill out this form with as much detail as possible. The structured format
        helps both human contributors and AI assistants understand and fix the issue.

  - type: textarea
    id: what
    attributes:
      label: What
      description: One sentence describing the bug.
      placeholder: "e.g., Bouncer fails to ban IPs when CrowdSec returns decisions with IPv6 addresses."
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: What happens now? Be specific.
      placeholder: "Describe exactly what occurs, including any error messages or unexpected output."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: "Describe the correct behavior you expect."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Configure bouncer with ...
        2. Trigger a CrowdSec decision for ...
        3. Observe that ...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - "Critical - System crash, data loss, or security vulnerability"
        - "High - Major feature broken, no workaround"
        - "Medium - Feature broken but workaround exists"
        - "Low - Minor issue, cosmetic, or edge case"
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: UniFi device model
      description: e.g., UDM SE, UDR, UCG-Ultra. See docs/device-compatibility.md for supported models.
      placeholder: "UDM SE"
    validations:
      required: true

  - type: input
    id: unifi-os-version
    attributes:
      label: UniFi OS version
      description: From Settings > System > UniFi OS, or `cat /etc/unifi-os/unifi_version`.
      placeholder: "4.x.x"
    validations:
      required: true

  - type: textarea
    id: detect-device-output
    attributes:
      label: detect-device.sh output
      description: Run /data/crowdsec-bouncer/detect-device.sh on the device and paste the full output.
      render: shell
      placeholder: "Paste the full detect-device.sh output here."
    validations:
      required: true

  - type: textarea
    id: ipset-status
    attributes:
      label: ipset list -t output
      description: Run `ipset list -t crowdsec-blacklists` (or `ipset list -t` for all sets) and paste the output. Required for capacity/"Hash is full" reports.
      render: shell
      placeholder: "Paste ipset list -t output here."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your setup.
      value: |
        - Project version / commit:
        - CrowdSec version:
        - Upstream cs-firewall-bouncer version:
        - UniFi Controller (Network application) version:
        - Sidecar deployed (yes/no):
        - Related services:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant log output or error messages.
      render: shell
      placeholder: "Paste relevant logs here. This field will be rendered as a code block."

  - type: textarea
    id: where-in-code
    attributes:
      label: Where in the Code
      description: File, class, method, or line range where the bug likely lives.
      placeholder: "e.g., src/bouncer.py, class UnifiBouncer, method apply_decisions(), around line 120"

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Specific, testable requirements for the fix.
      value: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: What must not break? What must the fix be compatible with?
      placeholder: |
        - Must not break: ...
        - Must work with: ...
        - Cannot add: ...

  - type: textarea
    id: ai-prompt
    attributes:
      label: AI Prompt Template (optional)
      description: A starting prompt contributors can paste into their AI assistant.
      render: markdown
      value: |
        I'm fixing a bug in crowdsec-unifi-bouncer. Here's the context:

        [Paste the project's AI context block from CONTRIBUTING.md]

        The bug is: [paste this issue]

        The relevant code is:
        [paste the file/function mentioned in "Where in the Code"]

        Please fix this bug while:
        - Preserving existing behavior
        - Following the project's code style
        - Adding appropriate error handling
